<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Money Flow</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/d3-sankey@0.12.3/dist/d3-sankey.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            font-size: 0.7em;
            margin: 20px;
        }

        .sankey {
            width: 100%;
            height: 1200px;
        }
    </style>
</head>

<body>

    <h1>Money Flow</h1>

    <div>
        <table>
            <tr>
                <td><label for="income-amount">Income Amount: </label></td>
                <td><input type="number" id="income-amount" value="180000" onchange="updateSankey()"></td>
            </tr>
            <tr>
                <td><label for="tax-deductions">Tax Deductions: </label></td>
                <td><input type="number" id="tax-deductions" value="12000" onchange="updateSankey()"></td>
            </tr>
            <tr>
                <td><label for="401k-contributions-pretax">401k Pre-Tax Contribution: </label></td>
                <td><input type="number" id="401k-contributions-pretax" value="23500" onchange="updateSankey()"></td>
            </tr>
            <tr>
                <td><label for="tax-rate">Effective tax rate: </label></td>
                <td><input type="text" id="tax-rate" value="0%" disabled></td>
            </tr>
            <tr>
                <td><label for="401k-contributions-employer">401k Employer Match: </label></td>
                <td><input type="number" id="401k-contributions-employer" value="11750" onchange="updateSankey()"></td>
            </tr>
            <tr>
                <td><label for="401k-contributions-posttax">401k Post-Tax Contribution: </label></td>
                <td><input type="number" id="401k-contributions-posttax" value="34750" onchange="updateSankey()"></td>
            </tr>
            <tr>
                <td><label for="ira-traditional">Traditional IRA Contribution: </label></td>
                <td><input type="number" id="ira-traditional" value="7000" onchange="updateSankey()"></td>
            </tr>


        </table>
    </div>
    <div>
        <button onclick="updateSankey()">Update Diagram</button>
    </div>
    <hr>

    <div id="sankey-controls"></div>
    <div class="sankey" id="sankey"></div>

    <script type="module" src="sankey.js"></script>
</body>

</html>
