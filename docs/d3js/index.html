<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Money Flow Sankey Diagram</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/d3-sankey@0.12.3/dist/d3-sankey.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            font-size: 0.7em;
            margin: 20px;
        }

        .sankey {
            width: 100%;
            height: 600px;
        }
    </style>
</head>

<body>

    <h1>Flow of Money from Paycheck to Checking Account</h1>

    <div>
        <table>
            <tr>
                <td><label for="paycheck-amount">Paycheck Amount: </label></td>
                <td><input type="number" id="paycheck-amount" value="180000"></td>
            </tr>
            <tr>
                <td><label for="401k-contributions-pretax">401k Pre-Tax Contribution: </label></td>
                <td><input type="number" id="401k-contributions-pretax" value="23500"></td>
            </tr>
            <tr>
                <td><label for="401k-contributions-employer">401k Employer Match: </label></td>
                <td><input type="number" id="401k-contributions-employer" value="11750"></td>
            </tr>
            <tr>
                <td><label for="401k-contributions-posttax">401k Post-Tax Contribution: </label></td>
                <td><input type="number" id="401k-contributions-posttax" value="34750"></td>
            </tr>
            <tr>
                <td><label for="ira-traditional">Traditional IRA Contribution: </label></td>
                <td><input type="number" id="ira-traditional" value="7000"></td>
            </tr>
            <tr>
                <td><label for="taxes">Taxes: </label></td>
                <td><input type="number" id="taxes" value="40000"></td>
            </tr>

        </table>
    </div>
    <div>
        <button onclick="updateSankey()">Update Diagram</button>
    </div>
    <hr>

    <div class="sankey" id="sankey"></div>

    <script src="sankey.js"></script>
</body>

</html>
